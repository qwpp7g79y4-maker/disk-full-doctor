[package]
name = "disk-full-doctor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["PEPAI <pep_ai@icloud.com>"]
description = "Read-only report of why a disk looks full when df and du disagree"
repository = "https://github.com/qwpp7g79y4-maker/disk-full-doctor"
homepage = "https://github.com/qwpp7g79y4-maker/disk-full-doctor"
documentation = "https://github.com/qwpp7g79y4-maker/disk-full-doctor"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[lib]
name = "disk_full_doctor"
path = "src/lib.rs"

[[bin]]
name = "disk-full-doctor"
path = "src/main.rs"
